<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>N0N-L1NERS</title>
    <link rel="stylesheet" href="stylenew.css">
</head>
<body>
<main class="app">

    <div class="top">
        <!-- A: inputs + selected items -->
        <section class="panel form" aria-label="Search inputs">
            <div class="fields">
                <div class="field span-3">
                    <div class="label-row">
                        <label for="query">Query</label>
                        <label class="check"><input type="checkbox" id="autoTranslate" checked> Translate VI to EN</label>
                    </div>
                    <input type="text" id="query" placeholder="e.g., a man standing and speaking" autocomplete="off">
                </div>
                <div class="field">
                    <label for="include">Include IDs</label>
                    <input type="text" id="include" placeholder="e.g., L21, L22" autocomplete="off">
                </div>

                <div class="field span-3">
                    <label for="context">Context (TRAKE)</label>
                    <input type="text" id="context" placeholder="Shared setting of all events, e.g., a cooking scene in a kitchen" autocomplete="off">
                </div>
                <div class="field">
                    <label id="refLabel">Reference image</label>
                    <div class="refbox" id="refBox" aria-labelledby="refLabel">
                        <input type="file" id="refFile" accept="image/*" hidden>
                        <button type="button" class="pick" id="refPick">Choose, drop or paste</button>
                        <img id="refThumb" alt="Reference preview" hidden>
                        <button type="button" class="x" id="refClear" aria-label="Remove reference image" hidden>&times;</button>
                    </div>
                </div>

                <div class="field"><label for="ev1">Event 1</label><input type="text" id="ev1" placeholder="e.g., a man opens a door" autocomplete="off"></div>
                <div class="field"><label for="ev2">Event 2</label><input type="text" id="ev2" placeholder="e.g., he sits down" autocomplete="off"></div>
                <div class="field"><label for="ev3">Event 3</label><input type="text" id="ev3" placeholder="optional" autocomplete="off"></div>
                <div class="field"><label for="ev4">Event 4</label><input type="text" id="ev4" placeholder="optional" autocomplete="off"></div>
            </div>

            <aside class="picked-box" aria-label="Selected items">
                <h2>Selected Items (<span id="pickedCount">0</span>)</h2>
                <ul class="picked-list" id="pickedList"></ul>
                <input type="text" id="qaAnswer" placeholder="QA answer (only for a single frame)" autocomplete="off">
                <div class="row">
                    <button type="button" class="btn-sm go" id="submitBtn">Submit</button>
                    <button type="button" class="btn-sm clear" id="clearPickedBtn">Clear All</button>
                </div>
                <p class="msg" id="submitMsg" role="status" aria-live="polite"></p>
            </aside>
        </section>

        <!-- B: actions -->
        <nav class="panel actions" aria-label="Actions">
            <button type="button" class="btn trake" id="trakeBtn">TRAKE</button>
            <button type="button" class="btn lookup" id="lookupBtn">Look up image</button>
            <button type="button" class="btn search" id="searchBtn">Search</button>
            <button type="button" class="btn reset" id="resetBtn">Reset</button>
            <button type="button" class="btn dres" id="dresToggle" aria-expanded="false" aria-controls="dresPop">DRES</button>
        </nav>

        <section class="dres-pop" id="dresPop" hidden aria-label="DRES login">
            <h2>DRES login</h2>
            <input type="text" id="dresUrl" value="https://eventretrieval.one/api/v2" aria-label="DRES base URL">
            <input type="text" id="dresUser" placeholder="Username" autocomplete="username" aria-label="Username">
            <input type="password" id="dresPass" placeholder="Password" autocomplete="current-password" aria-label="Password">
            <button type="button" class="btn dres" id="dresLogin">Log in</button>
            <select id="dresEval" aria-label="Evaluation" hidden></select>
            <p class="msg" id="dresMsg" role="status" aria-live="polite">Log in once, then pick an evaluation.</p>
        </section>
    </div>

    <hr class="rule">

    <!-- C: results -->
    <section class="results" aria-label="Results">
        <div class="status">
            <span id="status" role="status" aria-live="polite">Loading random keyframes...</span>
            <button type="button" class="link-btn" id="backBtn" hidden>Back to previous results</button>
        </div>
        <div class="gallery" id="gallery" aria-live="polite"></div>
    </section>
</main>

<template id="cardTpl">
    <div class="card" tabindex="0">
        <img alt="" loading="lazy" decoding="async">
        <span class="badge id"></span>
        <span class="badge tick" aria-hidden="true">&#10003;</span>
        <span class="badge score"></span>
        <span class="badge time"></span>
        <div class="overlay">
            <button type="button" class="act" data-act="ir" aria-label="Find similar images">
                <span class="dot"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>IR
            </button>
            <button type="button" class="act" data-act="video" aria-label="Play video at this frame">
                <span class="dot"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg></span>Video
            </button>
            <button type="button" class="act" data-act="submit" aria-label="Add to selected items">
                <span class="dot"><svg viewBox="0 0 24 24"><path d="m22 2-11 11"/><path d="m22 2-7 20-4-9-9-4z"/></svg></span>Submit
            </button>
            <button type="button" class="act" data-act="neighbors" aria-label="Show neighboring frames">
                <span class="dot"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="m21 16-5-5-8 8"/></svg></span>Neighbors
            </button>
        </div>
    </div>
</template>

<dialog id="videoDlg" aria-labelledby="videoTitle">
    <div class="dlg-head"><span id="videoTitle"></span><button type="button" id="videoClose" aria-label="Close video">&times;</button></div>
    <video id="player" controls preload="metadata"></video>
</dialog>

<script>
(() => {
    'use strict';

    // ---------- config ----------
    const API_BASE = 'http://127.0.0.1:8000';
    const SEARCH_TOP_K = 50;
    const TRAKE_TOP_K = 5;      // number of chains returned by TRAKE
    const MAX_PICKED = 4;       // KIS = 1 frame, TRAKE = 2..4 frames

    const $ = (id) => document.getElementById(id);
    const enc = encodeURIComponent;

    // ---------- state ----------
    let current = null;         // { items, opts } currently shown
    const stack = [];           // previous views (for "Back")
    let picked = [];            // selected frames
    let refFile = null;
    let searchCtl = null;
    let dresSession = null;
    let dresEvalId = null;

    // ---------- helpers ----------
    const say = (t) => { $('status').textContent = t; };
    const fileName = (p) => (p || '').split(/[/\\]/).pop();
    const fileStem = (p) => fileName(p).replace(/\.[^/.]+$/, '');
    const keyOf = (it) => `${it.video_name}|${it.frame_id}`;
    const stripExt = (n) => (n || '').trim().replace(/\.(mp4|mkv|webm|avi|mov)$/i, '');

    function mmss(sec) {
        sec = Math.max(0, Number(sec) || 0);
        return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
    }
    function timecode(sec) {
        sec = Math.max(0, Number(sec) || 0);
        const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.floor(sec % 60);
        const ms = Math.round((sec % 1) * 1000);
        const p = (n, l = 2) => String(n).padStart(l, '0');
        return `${p(h)}:${p(m)}:${p(s)}.${p(ms, 3)}`;
    }

    async function getJson(url, opts) {
        const res = await fetch(url, opts);
        return res.json();
    }

    async function translate(text) {
        if (!text || !$('autoTranslate').checked) return text;
        try {
            const res = await fetch(`${API_BASE}/api/translate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text }),
            });
            if (!res.ok) return text;
            const data = await res.json();
            return data.translated || text;
        } catch { return text; }
    }

    const videoFilter = () => $('include').value.trim();

    // ---------- gallery ----------
    function makeCard(item, opts) {
        const card = $('cardTpl').content.firstElementChild.cloneNode(true);
        card.dataset.key = keyOf(item);
        const img = card.querySelector('img');
        img.src = `${API_BASE}/api/image?path=${enc(item.image_path)}&w=360`;
        img.alt = fileName(item.image_path);
        card.querySelector('.badge.id').textContent = `${item.video_name},${item.frame_id}`;
        card.querySelector('.badge.time').textContent = mmss(item.pts_time);
        const sc = card.querySelector('.badge.score');
        if (item.score !== undefined && item.score !== null) sc.textContent = item.score; else sc.remove();
        if (opts.centerStem !== undefined && parseInt(fileStem(item.image_path), 10) === opts.centerStem) {
            card.classList.add('is-center');
        }
        return card;
    }

    function render() {
        const gallery = $('gallery');
        const { items, opts } = current;
        const frag = document.createDocumentFragment();
        gallery._items = items;

        $('backBtn').hidden = stack.length === 0;
        if (!items.length) {
            gallery.replaceChildren(Object.assign(document.createElement('p'), {
                className: 'empty-state', textContent: 'No results. Try another query.',
            }));
            return;
        }

        const n = opts.chain || 0;
        if (n > 1 && items.length % n === 0) {
            for (let i = 0; i < items.length; i += n) {
                const chain = document.createElement('div');
                chain.className = 'chain';
                for (let j = i; j < i + n; j++) {
                    const c = makeCard(items[j], opts);
                    c.dataset.idx = j;
                    chain.appendChild(c);
                }
                frag.appendChild(chain);
            }
        } else {
            items.forEach((it, i) => {
                const c = makeCard(it, opts);
                c.dataset.idx = i;
                frag.appendChild(c);
            });
        }
        gallery.replaceChildren(frag);
        markPicked();
        $('backBtn').hidden = stack.length === 0;
    }

    function show(items, opts = {}, { keepStack = false } = {}) {
        if (!keepStack) stack.length = 0;
        current = { items, opts };
        render();
    }

    function pushAndShow(items, opts) {
        if (current) stack.push(current);
        current = { items, opts };
        render();
    }

    function markPicked() {
        const keys = new Set(picked.map(keyOf));
        document.querySelectorAll('#gallery .card').forEach((c) => c.classList.toggle('picked', keys.has(c.dataset.key)));
    }

    // ---------- card actions ----------
    $('gallery').addEventListener('click', (e) => {
        const btn = e.target.closest('.act');
        if (!btn) return;
        const card = btn.closest('.card');
        const item = $('gallery')._items?.[Number(card.dataset.idx)];
        if (!item) return;
        const act = btn.dataset.act;
        if (act === 'ir') findSimilar(item);
        else if (act === 'video') openVideo(item);
        else if (act === 'submit') togglePick(item);
        else if (act === 'neighbors') showNeighbors(item);
    });

    async function findSimilar(item) {
        say('Finding similar frames...');
        try {
            const data = await getJson(`${API_BASE}/api/search/similar?image_path=${enc(item.image_path)}&top_k=${SEARCH_TOP_K}&video_filter=${enc(videoFilter())}`);
            if (data.results?.length) {
                pushAndShow(data.results, {});
                say(`${data.results.length} frames similar to ${item.video_name},${item.frame_id}`);
            } else {
                say(data.error || 'No similar frames found.');
            }
        } catch { say('Could not reach the server.'); }
    }

    async function showNeighbors(item) {
        const stem = fileStem(item.image_path);
        say('Loading neighboring frames...');
        try {
            const data = await getJson(`${API_BASE}/api/search/sequential-frames?video_name=${enc(item.video_name)}&center_frame_id=${enc(stem)}`);
            const list = (data.results || []).slice().sort((a, b) =>
                (parseInt(fileStem(a.image_path), 10) || 0) - (parseInt(fileStem(b.image_path), 10) || 0));
            if (!list.length) { say('No neighboring frames found.'); return; }
            pushAndShow(list, { centerStem: parseInt(stem, 10) });
            say(`Neighbors of ${item.video_name},${item.frame_id} (blue = selected frame)`);
        } catch { say('Could not reach the server.'); }
    }

    function openVideo(item) {
        const dlg = $('videoDlg'), v = $('player');
        $('videoTitle').textContent = `${item.video_name} at ${timecode(item.pts_time)}`;
        const t = Number(item.pts_time) || 0;
        const go = () => { v.currentTime = t; v.play().catch(() => {}); };
        if (v.dataset.name === item.video_name && v.readyState >= 1) {
            go();
        } else {
            v.dataset.name = item.video_name;
            v.src = `${API_BASE}/api/video?video_name=${enc(item.video_name)}`;
            v.addEventListener('loadedmetadata', go, { once: true });
            v.load();
        }
        dlg.showModal();
    }
    $('videoClose').addEventListener('click', () => $('videoDlg').close());
    $('videoDlg').addEventListener('close', () => $('player').pause());
    $('videoDlg').addEventListener('click', (e) => { if (e.target === $('videoDlg')) $('videoDlg').close(); });

    $('backBtn').addEventListener('click', () => {
        if (!stack.length) return;
        current = stack.pop();
        render();
        say('Back to previous results.');
    });

    // ---------- selected items ----------
    function setSubmitMsg(text, kind = '') {
        const m = $('submitMsg');
        m.textContent = text;
        m.className = `msg ${kind}`;
    }

    function renderPicked() {
        const list = $('pickedList');
        $('pickedCount').textContent = picked.length;
        list.replaceChildren();
        if (!picked.length) {
            const li = document.createElement('li');
            li.className = 'empty';
            li.textContent = 'Hover a frame and press Submit to pick it.';
            list.appendChild(li);
        }
        picked.forEach((p, i) => {
            const li = document.createElement('li');
            const name = Object.assign(document.createElement('span'), { className: 'name', textContent: `${p.video_name} #${p.frame_id}` });
            const time = Object.assign(document.createElement('span'), { className: 'time', textContent: mmss(p.pts_time) });
            const rm = Object.assign(document.createElement('button'), { type: 'button', textContent: '\u00d7' });
            rm.setAttribute('aria-label', `Remove ${p.video_name} frame ${p.frame_id}`);
            rm.addEventListener('click', () => { picked.splice(i, 1); renderPicked(); markPicked(); });
            li.append(name, time, rm);
            list.appendChild(li);
        });
        markPicked();
    }

    function togglePick(item) {
        const k = keyOf(item);
        const idx = picked.findIndex((p) => keyOf(p) === k);
        if (idx >= 0) {
            picked.splice(idx, 1);
        } else {
            if (picked.length >= MAX_PICKED) { setSubmitMsg(`You can pick at most ${MAX_PICKED} frames.`, 'bad'); return; }
            picked.push({ video_name: item.video_name, frame_id: item.frame_id, pts_time: item.pts_time, image_path: item.image_path });
        }
        setSubmitMsg('');
        renderPicked();
    }

    $('clearPickedBtn').addEventListener('click', () => { picked = []; setSubmitMsg(''); renderPicked(); });

    // ---------- search ----------
    async function doSearch() {
        const raw = $('query').value.trim();
        if (!raw) { say('Type a query first.'); return; }

        if (searchCtl) searchCtl.abort();
        const ctl = new AbortController();
        searchCtl = ctl;
        try {
            if ($('autoTranslate').checked) say('Translating...');
            const prompt = await translate(raw);
            say('Searching...');
            const vf = videoFilter();
            const data = await getJson(
                `${API_BASE}/api/search?prompt=${enc(prompt)}&top_k=${SEARCH_TOP_K}&video_filter=${enc(vf)}`,
                { signal: ctl.signal });
            if (data.results) {
                show(data.results);
                say(`${data.results.length} results${vf ? ` (filter: ${vf})` : ''}`);
            } else {
                say(data.error || 'No results.');
            }
        } catch (e) {
            if (e.name !== 'AbortError') say('Could not reach the server.');
        }
    }

    async function doTrake() {
        const raws = [1, 2, 3, 4].map((i) => $(`ev${i}`).value.trim());
        const active = raws.filter(Boolean).length;
        if (!active) { say('Type at least one event first.'); return; }

        try {
            if ($('autoTranslate').checked) say('Translating events and context...');
            const ctxRaw = $('context').value.trim();
            const [e1, e2, e3, e4, ctx] = await Promise.all([...raws, ctxRaw].map(translate));
            say('TRAKE: aligning events in time...');
            const data = await getJson(`${API_BASE}/api/search/trake`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    trek1: e1, trek2: e2, trek3: e3, trek4: e4,
                    context: ctx,
                    top_k: TRAKE_TOP_K,
                    video_filter: videoFilter(),
                }),
            });
            if (data.results) {
                show(data.results, { chain: active });
                say(data.results.length
                    ? `TRAKE: ${Math.round(data.results.length / active)} sequence(s), ${active} frames each`
                    : 'TRAKE: no video contains all events in order within 300 seconds.');
            } else {
                say(data.error || 'No TRAKE results.');
            }
        } catch { say('Could not reach the server.'); }
    }

    async function doLookup() {
        if (!refFile) { say('Choose, drop or paste a reference image first.'); return; }
        const form = new FormData();
        form.append('file', refFile);
        say('Looking up image...');
        try {
            const data = await getJson(`${API_BASE}/api/lookup/image`, { method: 'POST', body: form });
            if (data.results?.length) {
                show(data.results);
                say(data.match_type === 'exact'
                    ? 'Exact match (SHA-256).'
                    : `No hash match. ${data.results.length} closest frames.`);
            } else {
                say('No matching keyframe found.');
            }
        } catch { say('Could not reach the server.'); }
    }

    async function loadRandom() {
        try {
            const data = await getJson(`${API_BASE}/api/random?limit=24`);
            if (data.results) { show(data.results); say('Random keyframes. Enter a query to search.'); }
        } catch { say('Server not reachable at ' + API_BASE); }
    }

    function doReset() {
        ['query', 'include', 'context', 'ev1', 'ev2', 'ev3', 'ev4'].forEach((id) => { $(id).value = ''; });
        setRef(null);
        loadRandom();
    }

    $('searchBtn').addEventListener('click', doSearch);
    $('trakeBtn').addEventListener('click', doTrake);
    $('lookupBtn').addEventListener('click', doLookup);
    $('resetBtn').addEventListener('click', doReset);
    ['query', 'include'].forEach((id) => $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); }));
    ['context', 'ev1', 'ev2', 'ev3', 'ev4'].forEach((id) => $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') doTrake(); }));

    // ---------- reference image ----------
    function setRef(file) {
        refFile = file || null;
        const thumb = $('refThumb');
        if (thumb.dataset.url) { URL.revokeObjectURL(thumb.dataset.url); delete thumb.dataset.url; }
        if (refFile) {
            const url = URL.createObjectURL(refFile);
            thumb.src = url;
            thumb.dataset.url = url;
            $('refPick').textContent = refFile.name || 'Pasted image';
        } else {
            thumb.removeAttribute('src');
            $('refFile').value = '';
            $('refPick').textContent = 'Choose, drop or paste';
        }
        thumb.hidden = !refFile;
        $('refClear').hidden = !refFile;
    }
    $('refPick').addEventListener('click', () => $('refFile').click());
    $('refFile').addEventListener('change', (e) => { if (e.target.files[0]) setRef(e.target.files[0]); });
    $('refClear').addEventListener('click', () => setRef(null));
    const refBox = $('refBox');
    refBox.addEventListener('dragover', (e) => { e.preventDefault(); refBox.classList.add('dragover'); });
    refBox.addEventListener('dragleave', () => refBox.classList.remove('dragover'));
    refBox.addEventListener('drop', (e) => {
        e.preventDefault();
        refBox.classList.remove('dragover');
        const f = e.dataTransfer.files[0];
        if (f && f.type.startsWith('image/')) setRef(f);
    });
    window.addEventListener('paste', (e) => {
        const file = [...(e.clipboardData?.files || [])].find((f) => f.type.startsWith('image/'));
        if (file) setRef(file);
    });

    // ---------- DRES ----------
    const dresMsg = (t) => { $('dresMsg').textContent = t; };

    $('dresToggle').addEventListener('click', () => {
        const pop = $('dresPop');
        pop.hidden = !pop.hidden;
        $('dresToggle').setAttribute('aria-expanded', String(!pop.hidden));
    });

    try {
        $('dresUser').value = localStorage.getItem('dres_username') || '';
        dresSession = sessionStorage.getItem('dres_session');
    } catch { /* storage unavailable */ }

    async function loadEvaluations() {
        try {
            const data = await getJson(`${API_BASE}/api/dres/evaluations?base_url=${enc($('dresUrl').value.trim())}&session=${enc(dresSession)}`);
            const active = (Array.isArray(data) ? data : []).filter((e) => e.status === 'ACTIVE');
            if (!active.length) { dresMsg('No ACTIVE evaluation found.'); return; }
            const sel = $('dresEval');
            sel.replaceChildren(...active.map((ev) => Object.assign(document.createElement('option'), { value: ev.id, textContent: ev.name })));
            sel.hidden = false;
            dresEvalId = sel.value;
            dresMsg(`Ready: ${sel.selectedOptions[0].textContent}`);
        } catch (err) { dresMsg(`Could not load evaluations: ${err.message}`); }
    }
    $('dresEval').addEventListener('change', (e) => { dresEvalId = e.target.value; });

    $('dresLogin').addEventListener('click', async () => {
        const baseUrl = $('dresUrl').value.trim(), username = $('dresUser').value.trim(), password = $('dresPass').value;
        if (!baseUrl || !username || !password) { dresMsg('Enter URL, username and password.'); return; }
        dresMsg('Logging in...');
        try {
            const res = await fetch(`${API_BASE}/api/dres/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ base_url: baseUrl, username, password }),
            });
            const data = await res.json();
            if (!res.ok || !data.sessionId) throw new Error(data.description || 'Login failed.');
            dresSession = data.sessionId;
            try { localStorage.setItem('dres_username', username); sessionStorage.setItem('dres_session', dresSession); } catch { /* ignore */ }
            $('dresPass').value = '';
            await loadEvaluations();
        } catch (err) { dresMsg(err.message); }
    });

    if (dresSession) loadEvaluations();

    function buildAnswerSets() {
        if (!picked.length) throw new Error('Pick at least one frame first.');
        const video = stripExt(picked[0].video_name);
        if (picked.some((p) => stripExt(p.video_name) !== video)) throw new Error('All picked frames must be from the same video.');
        const ms = picked.map((p) => Math.round((Number(p.pts_time) || 0) * 1000));
        const qa = $('qaAnswer').value.trim();

        if (picked.length === 1) {
            if (qa) return { type: 'QA', sets: [{ answers: [{ text: `QA-${qa}-${video}-${ms[0]}` }] }] };
            return { type: 'KIS', sets: [{ answers: [{ mediaItemName: video, start: ms[0], end: ms[0] }] }] };
        }
        if (qa) throw new Error('A QA answer needs exactly one frame.');
        const sorted = [...ms].sort((a, b) => a - b);
        return { type: 'TRAKE', sets: [{ answers: [{ text: `TR-${video}-${sorted.join(',')}` }] }] };
    }

    $('submitBtn').addEventListener('click', async () => {
        if (!dresSession || !dresEvalId) {
            setSubmitMsg('Log in to DRES first (DRES button).', 'bad');
            return;
        }
        let built;
        try { built = buildAnswerSets(); } catch (err) { setSubmitMsg(err.message, 'bad'); return; }

        setSubmitMsg(`Submitting ${built.type}...`);
        try {
            const res = await fetch(`${API_BASE}/api/dres/submit`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    base_url: $('dresUrl').value.trim(),
                    session: dresSession,
                    evaluation_id: dresEvalId,
                    answer_sets: built.sets,
                }),
            });
            const data = await res.json().catch(() => ({}));
            const verdict = String(data.submission || data.status || data.verdict || '').toUpperCase();

            if (res.status === 401) setSubmitMsg('Session expired. Log in to DRES again.', 'bad');
            else if (res.status === 404) setSubmitMsg('Evaluation not found. Check the DRES login.', 'bad');
            else if (res.status === 412) setSubmitMsg('Rejected: duplicate submission or the task has ended.', 'bad');
            else if (res.ok && verdict.includes('WRONG')) setSubmitMsg(`${built.type}: WRONG.`, 'bad');
            else if (res.ok && (verdict.includes('INDETERMINATE') || verdict.includes('UNDECIDABLE'))) setSubmitMsg(`${built.type}: judges will review it.`);
            else if (res.ok && verdict.includes('CORRECT')) setSubmitMsg(`${built.type}: CORRECT.`, 'good');
            else if (res.ok) setSubmitMsg(`${built.type} sent (HTTP ${res.status}). No verdict returned.`, 'good');
            else setSubmitMsg(`Error ${res.status}: ${data.description || 'submission failed'}`, 'bad');

            if (res.ok) { picked = []; $('qaAnswer').value = ''; renderPicked(); }
        } catch (err) { setSubmitMsg(`Could not send: ${err.message}`, 'bad'); }
    });

    // ---------- start ----------
    renderPicked();
    loadRandom();
})();
</script>
</body>
</html>
